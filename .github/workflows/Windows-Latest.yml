name: Windows

on: workflow_dispatch

jobs:
  boot:
    runs-on: windows-latest
    steps:

    - name: Enable TS
      run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0

    - name: Enable Remote Desktop Firewall Rules
      run: Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Require User Authentication for RDP
      run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Set runneradmin password
      run: Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd!" -Force)

    - name: Install cloudflared (Windows)
      run: |
        $ErrorActionPreference = 'Stop'
        $url = 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe'
        $out = Join-Path $env:TEMP 'cloudflared.exe'
        Invoke-WebRequest -Uri $url -OutFile $out
        $destDir = 'C:\Program Files\cloudflared'
        New-Item -ItemType Directory -Path $destDir -Force | Out-Null
        $dest = Join-Path $destDir 'cloudflared.exe'
        Move-Item -Path $out -Destination $dest -Force
        # verify
        & $dest --version

    - name: Run Cloudflared Tunnel (Foreground)
      env:
        CF_TOKEN_WINDOWS: ${{ secrets.CF_TOKEN_WINDOWS }}
      run: |
        $exe = 'C:\Program Files\cloudflared\cloudflared.exe'
        & $exe tunnel run --token $env:CF_TOKEN_WINDOWS
