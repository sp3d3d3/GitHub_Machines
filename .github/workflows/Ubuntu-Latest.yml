name: Ubuntu
on: workflow_dispatch
jobs:
  system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Updating & Cleaning ..
        run: |
          cd ~
          sudo apt clean
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
          sudo apt update

      - name: Changing the Password ..
        run: |
          sudo bash -c 'echo -e "1234\n1234" | passwd runner' || true
          sudo hostnamectl set-hostname ammar0xff || true

      - name: Beautifying The Terminal ..
        run: |
          cd ~ || true
          wget -q "https://raw.githubusercontent.com/ammar0xff/GitHub_Machines/main/.github/workflows/.bashrc" -O ~/.bashrc || true

      - name: Installing cloudflared ..
        run: |
          set -e
          cd /tmp
          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo mv cloudflared /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version || true

      - name: Configuring Cloudflared Token ..
        env:
          CF_TUNNEL: ${{ secrets.CF_TUNNEL }}
        run: |
          echo "CF_TUNNEL=$CF_TUNNEL" >> $GITHUB_ENV

      - name: Running Cloudflared Tunnel ..
        env:
          CF_TUNNEL: ${{ secrets.CF_TUNNEL }}
        run: |
          export CF_TUNNEL="$CF_TUNNEL"
          cloudflared tunnel run --token "$CF_TUNNEL" > /dev/null 2>&1 &
      
      - name: Step 1 - Dummy heartbeat
        id: step1
        timeout-minutes: 300
        continue-on-error: true
        run: |
          echo "Step 1 started at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          while true; do
            sleep 300
            echo "Step 1 heartbeat: $(date -u +%Y-%m-%dT%H:%M:%SZ) - $RANDOM"
          done

      - name: Step 1 outcome
        run: echo "Step 1 outcome was ${{ steps.step1.outcome }}"

      - name: Step 2 - Dummy heartbeat
        id: step2
        timeout-minutes: 300
        continue-on-error: true
        run: |
          echo "Step 2 started at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          while true; do
            sleep 300
            echo "Step 2 heartbeat: $(date -u +%Y-%m-%dT%H:%M:%SZ) - $RANDOM"
          done

      - name: Step 2 outcome
        run: echo "Step 2 outcome was ${{ steps.step2.outcome }}"

      - name: Step 3 - Dummy heartbeat
        id: step3
        timeout-minutes: 300
        continue-on-error: true
        run: |
          echo "Step 3 started at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          while true; do
            sleep 300
            echo "Step 3 heartbeat: $(date -u +%Y-%m-%dT%H:%M:%SZ) - $RANDOM"
          done

      - name: Step 3 outcome
        run: echo "Step 3 outcome was ${{ steps.step3.outcome }}"

      - name: Step 4 - Dummy heartbeat
        id: step4
        timeout-minutes: 300
        continue-on-error: true
        run: |
          echo "Step 4 started at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          while true; do
            sleep 300
            echo "Step 4 heartbeat: $(date -u +%Y-%m-%dT%H:%M:%SZ) - $RANDOM"
          done

      - name: Step 4 outcome
        run: echo "Step 4 outcome was ${{ steps.step4.outcome }}"

      - name: Final summary
        if: always()
        run: |
          echo "Summary:"
          echo "Step 1: ${{ steps.step1.outcome }}"
          echo "Step 2: ${{ steps.step2.outcome }}"
          echo "Step 3: ${{ steps.step3.outcome }}"
          echo "Step 4: ${{ steps.step4.outcome }}"
