name: Ubuntu
on: workflow_dispatch
jobs:
  system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Updating & Cleaning ..
        run: |
          cd ~
          sudo apt clean
          sudo rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
          sudo apt update

      - name: Changing the Password ..
        run: |
          sudo bash -c 'echo -e "1234\n1234" | passwd runner' || true
          sudo hostnamectl set-hostname ammar0xff || true

      - name: Beautifying The Terminal ..
        run: |
          cd ~ || true
          wget -q "https://raw.githubusercontent.com/ammar0xff/GitHub_Machines/main/.github/workflows/.bashrc" -O ~/.bashrc || true

      - name: Installing cloudflared ..
        run: |
          set -e
          cd /tmp
          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo mv cloudflared /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version || true

      - name: Configuring Cloudflared Token ..
        env:
          CF_TUNNEL: ${{ secrets.CF_TUNNEL }}
        run: |
          echo "CF_TUNNEL=$CF_TUNNEL" >> $GITHUB_ENV

      - name: Running Cloudflared Tunnel ..
        env:
          CF_TUNNEL: ${{ secrets.CF_TUNNEL }}
        run: |
          export CF_TUNNEL="$CF_TUNNEL"
          cloudflared tunnel run --token "$CF_TUNNEL" 
